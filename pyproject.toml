[project]
name = "transcript-reconciliation"
version = "0.1.0"
description = "Does the record a monitor reads differ from what ran in the sandbox? Comparisons on Inspect logs."
requires-python = ">=3.12"
# Exact pins. The pilot ran on control-arena 19.0.0 and inspect-ai 0.3.275 (pilot/manifests/). The first
# run here moves control-arena to 20.1.1 and holds inspect-ai, so that one of the two changes at a time.
dependencies = [
    "control-arena==20.1.1",
    "inspect-ai==0.3.275",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The pilot's files are a record: they are not reformatted and they do not run here.
"pilot/**" = ["ALL"]

[tool.ruff.format]
exclude = ["pilot/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
